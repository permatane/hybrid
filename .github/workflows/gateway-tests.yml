name: RIVIS Gateway CI

on:
  push:
    branches: [main]
    paths:
      - 'netlify/**'
      - 'cloudflare-gateway/**'
      - 'public/**'
      - 'hybrid/**'
      - 'tests/**'
      - 'README_DEPLOY.md'
      - 'README_AUTO_DEPLOY.md'
      - 'netlify.toml'
      - 'package.json'
      - '.github/workflows/gateway-tests.yml'
  pull_request:
    paths:
      - 'netlify/**'
      - 'cloudflare-gateway/**'
      - 'public/**'
      - 'hybrid/**'
      - 'tests/**'
      - 'README_DEPLOY.md'
      - 'README_AUTO_DEPLOY.md'
      - 'netlify.toml'
      - 'package.json'

permissions:
  contents: read

jobs:
  gateway-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hybrid/rivis.support.js && node --check hybrid/rivis.ai.js && node --check hybrid/rivis.motion.js && node --check netlify/functions/_veo.cjs && node --check netlify/functions/motion-generate.js && node --check netlify/functions/motion-status.js
      - run: npm test
      - run: npm run build --prefix cloudflare-gateway
